name: Rust and package checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - ".ci/stata/latest.json"
      - ".ci/stata/results/**"

concurrency:
  group: ferank-ci-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  hosted-rust:
    name: Rust and Python / hosted Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy

      - name: Test CI receipt machinery
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Validate the Stata distribution
        run: python3 ci/check_stata_package.py

      - name: Run Rust checks
        run: bash ci/run_rust_quick.sh
